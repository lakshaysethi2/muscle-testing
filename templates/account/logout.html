{% extends "base.html" %}

{% block title %}Signed Out — TruthCheck{% endblock %}

        <h1 class="text-2xl font-bold text-gray-900 mb-4">You've been signed out</h1>
        <p class="text-gray-600 mb-6">Thank you for visiting TruthCheck.</p>

        <div class="flex gap-3 justify-center">

                Home

            <a href="{% url 'account_login' %}" class="py-2.5 px-4 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">

    </div>
