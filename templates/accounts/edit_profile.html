{% extends "base.html" %}

{% block title %}Edit Profile — KineticTruth{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Profile</h1>

    <form method="post" enctype="multipart/form-data" class="bg-white rounded-xl shadow p-6 space-y-5">
        {% csrf_token %}

        <div>
            <label for="bio" class="block text-sm font-medium text-gray-700 mb-1">
                Bio / Intention
            </label>
            <textarea id="bio" name="bio" rows="3"
                      class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
                      placeholder="A few words about yourself...">{{ user.bio }}</textarea>
        </div>

        <div>
            <label for="testing_method" class="block text-sm font-medium text-gray-700 mb-1">
                Preferred Testing Method
            </label>
            <select id="testing_method" name="testing_method"
                    class="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                {% for value, label in user.TestingMethod.choices %}
                <option value="{{ value }}" {% if user.testing_method == value %}selected{% endif %}>
                    {{ label }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="avatar" class="block text-sm font-medium text-gray-700 mb-1">
                Avatar
            </label>
            <input type="file" id="avatar" name="avatar" accept="image/*"
                   class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <button type="submit"
                class="w-full py-2.5 px-4 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">
            Save Changes
        </button>
    </form>
</div>
{% endblock %}
