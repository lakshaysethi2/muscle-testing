services:
  web:
    build: .
    container_name: truthcheck-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: truthcheck-redis
    ports:
      - "6379:6379"
